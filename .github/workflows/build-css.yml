# index.html を更新（アップロード）すると、自動で tailwind.css を作り直して保存します
name: Build Tailwind CSS

on:
  push:
    branches: [main]
    paths:
      - index.html
      - tailwind.config.js
      - src/input.css
  workflow_dispatch:   # 画面から手動でも実行できます

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build tailwind.css
        run: npx --yes tailwindcss@3.4.17 -i ./src/input.css -o ./tailwind.css --minify
      - name: Save tailwind.css
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tailwind.css
          git diff --cached --quiet || git commit -m "Build tailwind.css"
          git push
